# The `researcher` agent preset: the autonomous-research composition.
#
# This file is an AGENT-PLANE composition like `standard`: the host plane
# carries no model-facing tools, so the researcher mounts the full coding-agent
# surface itself — shell, filesystem, jobs, skills, goal, plan mode,
# compaction, delegation, workflows — and adds the researcher rows on top: the
# research protocol (autoresearch toggle, cycle prompt section, design-defense
# gate), the experiment-tracking and decision-ledger stores in one shared realm
# (the ledger resolves cited run ids through the tracker), and the three
# debate/execution seats as fork-or-spawn tool instances. Row-by-row ownership
# notes live in `standard/agent.cordis.yml`; only researcher-specific deltas
# are commented here.
#
# J-Space stays host-owned: its settings namespace is registered by the base
# bundle, so this preset must not re-mount the seat. Enable the card through
# Settings; the design-defense epoch anchor reads it when present and falls
# back to session start when not.
#
# The tracker provider composes spool-only: without a `credentialRef` it never
# posts and never holds a token; runs land in the durable local spool.
# Point `baseUrl`/`lane` at a real deployment to post.

- id: persona
  name: '@shres-code/shres-code-persona'
  config:
    text: >-
      You are an autonomous research agent. You run the researcher cycle —
      hypothesis, design defense, experiment, evidence, verdict, ledger,
      digest — to a verified decision.

- id: agent-instructions
  name: '@shres-code/shres-code-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@shres-code/shres-code-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@shres-code/shres-code-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@shres-code/shres-code-tool-fs'

- id: tool-fs-search
  name: '@shres-code/shres-code-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@shres-code/shres-code-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@shres-code/shres-code-skill-filesystem'

- id: tool-skill
  name: '@shres-code/shres-code-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The design-defense gate keys on the current Goal epoch, so the goal tool is
# not optional here: without it the agent cannot open the epoch the gate reads.
- id: tool-goal
  name: '@shres-code/shres-code-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@shres-code/shres-code-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@shres-code/shres-code-compaction-basic'

    - id: command-compact
      name: '@shres-code/shres-code-command-compact'

    - id: tool-result-pruner
      name: '@shres-code/shres-code-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@shres-code/shres-code-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@shres-code/shres-code-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@shres-code/shres-code-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@shres-code/shres-code-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@shres-code/shres-code-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@shres-code/shres-code-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-grok-cli
      name: '@shres-code/shres-code-tool-subagent'
      disabled: true
      config:
        provider: grok-cli
        toolName: subagent_grok_cli
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-kimi-cli
      name: '@shres-code/shres-code-tool-subagent'
      disabled: true
      config:
        provider: kimi-cli
        toolName: subagent_kimi_cli
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@shres-code/shres-code-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@shres-code/shres-code-tool-workflow'

    - id: tool-ralph
      name: '@shres-code/shres-code-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@shres-code/shres-code-tool-ask-user'

- id: tool-todo
  name: '@shres-code/shres-code-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@shres-code/shres-code-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── research ────────────────────────────────────────────────────────────────

- id: research-protocol
  name: '@shres-code/shres-code-research-protocol'
  config:
    enabled: true

# One realm for both project stores: the ledger resolves cited run ids
# through ctx.tracker, so they must share scope.
- id: research-stores
  name: cordis:group
  group: true
  isolate:
    tracker: true
    ledger: true
  config:
    - id: tracker-shrestech
      name: '@shres-code/shres-code-tracker-shrestech'
      config:
        baseUrl: 'https://tracker.invalid'
        lane: 'researcher'

    - id: tool-tracker
      name: '@shres-code/shres-code-tool-tracker'

    - id: ledger
      name: '@shres-code/shres-code-ledger'
      config:
        storagePath: 'research-ledger.jsonl'  # relative resolves under the harness home (ledger/)

    - id: tool-ledger
      name: '@shres-code/shres-code-tool-ledger'

# Wiki stays host-owned: ctx.wiki and the wiki settings namespace are
# registered by the base bundle, so this preset must not re-mount the seat.
# Bind a cheap/local (or Ollama Cloud) librarian through Settings → J-Space
# → LLM Wiki; unbound, the librarian stays dormant.

# The seats: design defense forks the parent session (aegis for feasibility,
# ward against it — give ward a different model than the parent at the
# deployment layer via agentOptions.model, so the reviewer does not share the
# executor's blind spots); experiments run in spawned children.
- id: seats
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-aegis
      name: '@shres-code/shres-code-tool-subagent'
      config:
        provider: fork
        toolName: aegis
        backgroundMode: continuable

    - id: tool-subagent-ward
      name: '@shres-code/shres-code-tool-subagent'
      config:
        provider: fork
        toolName: ward
        backgroundMode: continuable

    - id: tool-subagent-stride
      name: '@shres-code/shres-code-tool-subagent'
      config:
        provider: spawn
        toolName: stride
        backgroundMode: continuable
