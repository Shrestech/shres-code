# The Electron desktop reuses the browser composition without its network,
# browser-launch, and dev-reload rows. The desktop host carries every request
# itself over framed byte pipes, so the composition must not bind a socket.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@shres-code/shres-code-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@shres-code/shres-code-client-ui-directory-picker-native'
