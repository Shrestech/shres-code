# The roos-base bundle patch: the shared core of every roos profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: timer
      name: '@roos-code/cordis-plugin-timer'

    - id: hmr
      name: '@roos-code/cordis-plugin-hmr'
      config:
        root: ['.']

    - id: llm
      name: '@roos-code/roos-code-llm'

    - id: session
      name: '@roos-code/roos-code-session'

    - id: typert
      name: '@roos-code/roos-code-typert-registry'

    - id: typert-loader
      name: '@roos-code/roos-code-typert-loader'

    - id: typert-gateway
      name: '@roos-code/roos-code-api-gateway'

    - id: session-title
      name: '@roos-code/roos-code-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@roos-code/roos-code-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@roos-code/roos-code-user-questions'

    - id: agent
      name: '@roos-code/roos-code-agent'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@roos-code/roos-code-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

    - id: jobs
      name: '@roos-code/roos-code-jobs-local'

    - id: llm-retry
      name: '@roos-code/roos-code-llm-retry'

    # User-settings document (`$ROOS_HOME/settings.yaml`, hot-reloaded): a
    # `llm-deepseek:` or `llm-pi-ai:` section there overrides the adapter entries
    # below without a restart, and is what the web Models page writes.
    - id: settings
      name: '@roos-code/roos-code-settings-file'

    # Credential sources: inherited environment over the managed
    # `$ROOS_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: credentials
      name: '@roos-code/roos-code-credentials-local'

    # Default any-API routes. Named `apiKeyEnv` values stay unset until the user
    # stores a key (MISSING_CREDENTIAL on use). ollama-local is keyless: pi-ai's
    # OpenAI-compatible client still wants an Authorization header, so the route
    # sends a dummy Bearer token. ollama-cloud model ids use the public `:cloud`
    # suffix; contextWindow/maxTokens are pinned because GET /models does not
    # disclose them. first-run-setup offers these routes when no usable default
    # exists; it never silently picks a vendor.
    - id: llm-pi-ai
      name: '@roos-code/roos-code-llm-pi-ai'
      config:
        providers:
          ollama-local:
            displayName: Ollama (local)
            api: openai-completions
            baseURL: http://localhost:11434/v1
            headers:
              Authorization: Bearer ollama
            models:
              - id: llama3.2
                name: Llama 3.2
          ollama-cloud:
            displayName: Ollama Cloud
            api: openai-completions
            baseURL: https://ollama.com/v1
            apiKeyEnv: OLLAMA_API_KEY
            models:
              - id: deepseek-v4-flash:cloud
                name: DeepSeek V4 Flash (cloud)
                contextWindow: 1048576
                maxTokens: 32768
              - id: deepseek-v4-pro:cloud
                name: DeepSeek V4 Pro (cloud)
                contextWindow: 1048576
                maxTokens: 32768
          openai:
            apiKeyEnv: OPENAI_API_KEY
          anthropic:
            apiKeyEnv: ANTHROPIC_API_KEY
          xai:
            apiKeyEnv: XAI_API_KEY
          moonshotai:
            apiKeyEnv: MOONSHOT_API_KEY
          openrouter:
            apiKeyEnv: OPENROUTER_API_KEY
          groq:
            apiKeyEnv: GROQ_API_KEY
          zai:
            apiKeyEnv: ZAI_API_KEY

    # First-run picker: probes local Ollama and, on headless, prints a TTY menu
    # when the composition default cannot serve. autoRunCli stays false here so
    # the Web process never blocks on stdin; headless calls ensureReady() after
    # the loader settles.
    - id: first-run-setup
      name: '@roos-code/roos-code-first-run-setup'
      config:
        ollamaBaseURL: http://localhost:11434/v1
        detectTimeoutMs: 1500
        autoRunCli: false

    - id: session-persistence-jsonl
      name: '@roos-code/roos-code-session-persistence-jsonl'
      config:
        root: !!js roosHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@roos-code/roos-code-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@roos-code/roos-code-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: '@roos-code/roos-code-session-projection'

    # Session telemetry is mounted but disabled by default. ROOS_TELEMETRY_MODE
    # explicitly opts into FULL or FEEDBACK_ONLY reporting; uploading mirrors
    # session-log records onto OTLP/HTTP logs with no session-telemetry/record redaction
    # rule, so exports are the raw captured copy. The deployment stance, env
    # seams, and follow-ups are pinned in the default-off Agent Note.
    # ROOS_TELEMETRY_OTLP_URL overrides the production endpoint. A non-empty
    # ROOS_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($ROOS_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@roos-code/roos-code-session-telemetry-otel'
      config:
        mode: !!js process.env.ROOS_TELEMETRY_MODE || 'DISABLED'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.ROOS_TELEMETRY_OTLP_URL ?? 'https://harness-telemetry.deepseeksvc.com/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@roos-code/roos-code-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@roos-code/roos-code-sandbox-local'

    - id: sandbox-policy
      name: '@roos-code/roos-code-sandbox-policy'
      config:
        mode: !!js process.env.ROOS_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@roos-code/roos-code-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@roos-code/roos-code-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@roos-code/roos-code-user-approval'
      config:
        policy: !!js "(process.env.ROOS_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@roos-code/roos-code-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@roos-code/roos-code-shell-env'

    - id: tool-bash
      name: '@roos-code/roos-code-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@roos-code/roos-code-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@roos-code/roos-code-tool-jobs'

    - id: fs-observation-policy
      name: '@roos-code/roos-code-fs-observation-policy'

    - id: tool-fs
      name: '@roos-code/roos-code-tool-fs'

    - id: tool-fs-search
      name: '@roos-code/roos-code-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@roos-code/roos-code-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@roos-code/roos-code-skill'

    - id: skill-filesystem
      name: '@roos-code/roos-code-skill-filesystem'

    - id: skill-badge
      name: '@roos-code/roos-code-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@roos-code/roos-code-tool-skill'

    - id: commands
      name: '@roos-code/roos-code-commands'

    - id: command-feedback
      name: '@roos-code/roos-code-command-feedback'

    - id: goal
      name: '@roos-code/roos-code-goal'

    - id: goal-round-driver
      name: '@roos-code/roos-code-goal-round-driver'

    - id: command-goal
      name: '@roos-code/roos-code-command-goal'

    - id: plan-mode
      name: '@roos-code/roos-code-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@roos-code/roos-code-token-meter'

    - id: compaction-basic
      name: '@roos-code/roos-code-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@roos-code/roos-code-command-compact'

    - id: subagent
      name: '@roos-code/roos-code-subagent'

    - id: subagent-spawn-in-process
      name: '@roos-code/roos-code-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@roos-code/roos-code-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@roos-code/roos-code-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@roos-code/roos-code-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@roos-code/roos-code-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Named Boomer / Joey / Flyer seats remount extra spawn tools from the
    # `agent-seats` settings section. Unbound seats register nothing.
    - id: agent-seats
      name: '@roos-code/roos-code-agent-seats'

    # Fork stays one-shot: a continuable child's `report` tool and prompt
    # section precede the inherited history a fork exists to reuse; one-shot
    # fork children install neither, keeping the parent's request prefix.
    # See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@roos-code/roos-code-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    # Optional direct-child return channel; absent from roots and one-shot agents.
    - id: tool-subagent-report
      name: '@roos-code/roos-code-tool-subagent-report'

    - id: workflow-worker-thread
      name: '@roos-code/roos-code-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@roos-code/roos-code-tool-workflow'

    - id: timeout-policy
      name: '@roos-code/roos-code-tool-call-timeout-policy'

    - id: spill-local
      name: '@roos-code/roos-code-spill-local'

    - id: spill-policy
      name: '@roos-code/roos-code-spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@roos-code/roos-code-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@roos-code/roos-code-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@roos-code/roos-code-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@roos-code/roos-code-tool-goal'

    # Fresh-agent Ralph iteration over a build-time-fixed script.
    - id: tool-ralph
      name: '@roos-code/roos-code-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    - id: tool-str-replace-editor
      name: '@roos-code/roos-code-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@roos-code/roos-code-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # Every mode enables the stable model-facing web_search tool. An attached
    # CLI (Grok, Claude, Codex, Kimi) owns search through that vendor's hosted
    # web-search tool and the same credential the Models page already stores;
    # DeepSeek official is the fallback when no listed vendor has a key. Fetch stays
    # disabled and no fetch provider is mounted: that provider defers SSRF
    # protection and the model would choose the request target. Search is a full
    # auxiliary model request with server-side retrieval, so this shipped route
    # gets 60s while the provider-neutral tool default remains 30s.
    - id: web
      name: '@roos-code/roos-code-web'
      config:
        searchProviders:
          - attached-cli
          - deepseek-official

    - id: web-search-attached-cli
      name: '@roos-code/roos-code-web-search-attached-cli'

    - id: web-search-deepseek
      name: '@roos-code/roos-code-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: tool-web
      name: '@roos-code/roos-code-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@roos-code/roos-code-tools'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@roos-code/roos-code-system-prompt'
      config:
        persona: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@roos-code/roos-code-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@roos-code/roos-code-fs-sandbox'

    # The native DeepSeek adapter. No key or endpoint is inlined: both resolve per
    # request from the `llm-deepseek:` settings section over this entry, with the
    # key coming from the credential store below. Thinking defaults are a deployment
    # choice.
    # Delegated CLI completions. Each route runs an external coding-agent
    # binary; its own tools bypass harness approval. The Models picker marks
    # them delegated. `roos models set grok-cli <model> --effort <level>`
    # writes through the same agent-default-model section as HTTP routes.
    - id: llm-cli-bridge
      name: '@roos-code/roos-code-llm-cli-bridge'

    - id: llm-deepseek
      name: '@roos-code/roos-code-llm-deepseek'
