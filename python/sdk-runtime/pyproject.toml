[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "shres-code-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned Shres Code runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/parthmstech/shres-code"
Documentation = "https://github.com/parthmstech/shres-code/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/parthmstech/shres-code/issues"
Source = "https://github.com/parthmstech/shres-code"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/shres_code_runtime/runtime/shres-jsonrpc-agent-*"]
exclude = ["src/shres_code_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/shres_code_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
