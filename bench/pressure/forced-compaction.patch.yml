# Pressure overlay: force mid-task compaction on the existing 10–30-turn
# catalog. Long-horizon features (card, session-query) only show their value
# under memory pressure — tokens consumed vs context available — and the
# shipped tasks never reach the default 0.8 × context-window threshold
# (≈800k tokens on the 1M DeepSeek / Ollama Cloud windows).
#
# thresholdRatio 0.015 fires at floor(window × 0.015): ≈15k tokens on 1M
# windows, ≈3k on a 200k window. retainRatio must stay below that ratio
# (the plugin default 0.16 would fail load). A config patch replaces the
# whole entry config, so every field automatic compaction needs is restated.
# Applies identically to every arm; combine with a provider tier via a
# second --tier-patch. A long-horizon verdict only counts when
# pressureFired is true.
# maxPointers 0 pins the pre-pointer instrument the w7/w8 baselines and the
# w9 power analysis were measured on; summary seq pointers get their own
# paired experiment (compaction-pointer-follow) rather than riding into every
# pressure contrast.
- id: compaction-basic
  config:
    auto: true
    thresholdRatio: 0.015
    retainRatio: 0.003
    maxTokens: 8192
    compactionRetries: 1
    maxOverflowRetries: 1
    maxPointers: 0
