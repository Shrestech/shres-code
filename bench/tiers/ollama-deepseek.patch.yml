# Tier overlay: Ollama Cloud serving DeepSeek-V4-Flash (OpenAI-compatible).
# Disables llm-deepseek and inserts llm-pi-ai with a credentialed ollama route.
# Applied as --tier-patch alongside the per-arm overlay; run with
# --api-key-env OLLAMA_API_KEY (key from https://ollama.com/settings/keys).
#
# The dated :0731-cloud tag pins the model for reproducible experiments;
# :cloud floats to Ollama's current default.
- id: llm-deepseek
  disabled: true
- insert:
    - id: llm
      name: '@shres-code/shres-code-llm-pi-ai'
      config:
        providers:
          ollama:
            apiKeyEnv: OLLAMA_API_KEY
            baseURL: https://ollama.com/v1
            models:
              - id: deepseek-v4-flash:0731-cloud
                contextWindow: 1048576
