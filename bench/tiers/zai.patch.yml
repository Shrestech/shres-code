# Tier overlay: Z.ai GLM over the base profile's shipped `zai` route
# (llm-pi-ai, `apiKeyEnv: ZAI_API_KEY`, model catalog from pi-ai).
# Applied as --tier-patch alongside the per-arm overlay; run with
# --api-key-env ZAI_API_KEY. A config patch replaces the entry's whole
# config, so both fields are stated.
- id: agent-default-model
  config:
    provider: zai
    model: glm-5.2
