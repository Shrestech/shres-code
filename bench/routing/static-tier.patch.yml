# Pinned exploratory static-tier treatment (arm T, L3 only).
# The renderer includes these rows verbatim and adds the trial session root.
#
# With no judgment engine, main-conversation decisions keep the strong route.
# Static policies route spawn delegations to the cheap candidate; forks never
# dispatch a child-route request. The required main-routing thresholds and
# instructions match R but are inert without an engine.
#
# Arm integrity requires no downgraded main decisions and at least one routed
# child for every task that delegated. Metered-provider acceptance of the
# hand-declared model id remains unproven until an owner-approved real run.
# This exploratory definition requires owner confirmation before a real T trial.
- id: agent-default-model
  config:
    provider: "anthropic"
    model: "claude-opus-5-5"
- id: llm-pi-ai
  config:
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY_T
        cacheRetention: "long"
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5
            contextWindow: 1000000
            maxTokens: 128000
            compat:
              forceAdaptiveThinking: true
              supportsTemperature: false
- insert:
    - id: model-router
      name: "@shres-code/shres-code-model-router"
      config:
        initialMode: "on"
        downgradeThreshold: 0.8
        downgradeMargin: 0.1
        routeInstructions: "Which route should handle this turn? Choose the cheapest route that is still a safe fit, or the strong route when the turn is ambiguous or its work is not yet known."
        tier: "fast"
        candidates: [{"id":"flash","provider":"deepseek-official","model":"deepseek-v4-flash","description":"a small, well-scoped change in familiar code"}]
        routeFrom: [{"provider":"anthropic","model":"claude-opus-5-5","objective":"quota"}]
        hold: {"minSteps":0,"maxSteps":40}
        maxRouteErrors: 2
        onUnavailable: "fallback"
        judgmentDeadlineMs: 1500
        judgmentFailures: {"holdTolerance":2,"breakerThreshold":3,"breakerOpenTurns":5}
        childPolicies: [{"match":{"kind":"subagent"},"candidate":"flash","judge":false}]
        childRouteErrors: 2
