# Opt-in routing arm for the owned local Shield judgment gateway.
#
# The gateway must already be serving the pinned artifacts on loopback port
# 8765. This overlay is intentionally separate from route-on.patch.yml and is
# not installed in a shipped profile until the labeled routing-quality gate
# passes. Both tiers use the pinned Convai Laya reference artifact as the
# development baseline; the route policy stays identical so the provider is
# the variable. Replace these ids only with an artifact whose provenance is
# recorded by the owned gateway.
- id: agent-default-model
  config:
    provider: "deepseek-official"
    model: "deepseek-v4-pro"
- insert:
    - id: judgment-shield
      name: "@shres-code/shres-code-judgment-shield"
      config:
        endpoint: "http://127.0.0.1:8765"
        models:
          fast: "convaiinnovations/laya@1c5edc17a7acd8701df6fc341c0d179f1c62c982"
          accurate: "convaiinnovations/laya@1c5edc17a7acd8701df6fc341c0d179f1c62c982"
        timeoutMs: 30000
        maxResponseBytes: 4194304
    - id: model-router
      name: "@shres-code/shres-code-model-router"
      config:
        initialMode: "on"
        tier: "fast"
        candidates: [{"id":"flash","provider":"deepseek-official","model":"deepseek-v4-flash","description":"a small, well-scoped change in familiar code"}]
        downgradeThreshold: 0.8
        downgradeMargin: 0.1
        minTurnsDowngraded: 5
        # Keep 4 here to preserve the preregistered route-on comparison arm;
        # the repaired shipped model-router default is 3.
        escalateBack: {"scoreThreshold":4}
        maxRouteErrors: 2
        onUnavailable: "fallback"
        routeInstructions: "Which route should handle this turn? Choose the cheapest route that is still a safe fit, or the strong route when the turn is ambiguous or its work is not yet known."
        difficultyInstructions: "How hard is this turn for the model handling it? Score it on the levels below."
