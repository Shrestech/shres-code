# Pinned treatment rows for the route-random arm — arm N, random-matched.
#
# ArmEntry.pinnedOverlay names this file and bench/runner/arms.js emits its
# content verbatim into the arm's per-trial --patch overlay, so this file is
# the single source of the measured composition. The file is path-free and
# timestamp-free; the per-trial session root is added by the renderer.
#
# The arm is arm R's composition with the judge swapped: the bench-only
# bench-random engine answers a seeded draw per consult at the entry rate arm R
# realized at its cold points in the calibration run, so H2 measures what the
# judge's discrimination adds over chance at the matched rate. The strong
# route, the candidate, the cold points, and every gate figure are identical
# to route-coldpoint.patch.yml; read that file's header for the PR 12
# dependency and the key isolation.
#
# The entry rate and seed shipped here are PROVISIONAL and the operating point
# deliberately carries NO calibratedBy (its presence alone would mark the point
# calibrated): replay-judges.mjs is the only writer of the matched rate, the
# point's threshold and margin, and the registration's calibratedBy, and the
# runner refuses confirmatory trials unless the registration records a passed
# Laya gate, a matching overlay, and N's rate equal to R's realized entry rate.
- id: agent-default-model
  config:
    provider: "anthropic"
    model: "claude-opus-5-5"
- id: llm-pi-ai
  config:
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY_N
        cacheRetention: "long"
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5
            contextWindow: 1000000
            maxTokens: 128000
            compat:
              forceAdaptiveThinking: true
              supportsTemperature: false
- insert:
    - id: judgment-bench-random
      name: "@shres-code/shres-code-judgment-bench-random"
      config:
        entryRate: 0.3
        seed: 20261016
    - id: judgment-dispatch
      name: "@shres-code/shres-code-judgment-dispatch"
      config:
        defaultEngine: "bench-random"
    - id: model-router
      name: "@shres-code/shres-code-model-router"
      config:
        initialMode: "on"
        tier: "fast"
        candidates: [{"id":"flash","provider":"deepseek-official","model":"deepseek-v4-flash","description":"a small, well-scoped change in familiar code"}]
        routeFrom: [{"provider":"anthropic","model":"claude-opus-5-5","objective":"quota"}]
        operatingPoints: [{"engine":"bench-random","downgradeThreshold":0.8,"downgradeMargin":0.1}]
        hold: {"minSteps":20,"maxSteps":40}
        difficulty: {"entryScoreCeiling":2}
        reentryCooldownTurns: 2
        escalateBack: {"scoreThreshold":4}
        maxRouteErrors: 2
        onUnavailable: "fallback"
        judgmentDeadlineMs: 1500
        judgmentFailures: {"holdTolerance":2,"breakerThreshold":3,"breakerOpenTurns":5}
        routeInstructions: "Which route should handle this turn? Choose the cheapest route that is still a safe fit, or the strong route when the turn is ambiguous or its work is not yet known."
        difficultyInstructions: "How hard is this turn for the model handling it? Score it on the levels below."
