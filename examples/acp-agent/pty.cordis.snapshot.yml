# Keyless replay counterpart to pty.cordis.yml.
- id: base
  name: '@roos-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@roos-code/roos-code-llm-deepseek'
        disabled: true
      - insert:
          - id: pty
            name: '@roos-code/roos-code-terminal'
          - id: pty-snapshot-backend
            name: './pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@roos-code/roos-code-tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@roos-code/roos-code-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
