# Add Code Mode and Cordis tools to the base spawn/workflow stack, exercising
# all four boundaries in one ACP snapshot. Session-query tools come from the
# included base composition.
- id: base
  name: '@shres-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@shres-code/shres-code-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-pro
          persistenceRoot: !!js process.env.SHRES_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.SHRES_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@shres-code/shres-code-code-runtime-worker-thread'
          - id: cordis-host-runner
            name: '@shres-code/shres-code-cordis-host-runner'
          - id: tool-cordis
            name: '@shres-code/shres-code-tool-cordis'
