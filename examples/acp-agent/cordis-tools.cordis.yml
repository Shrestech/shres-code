# Add the self-referential Cordis tools without changing the base ACP tool
# presentation mode.
- id: base
  name: '@roos-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: cordis-host-runner
            name: '@roos-code/roos-code-cordis-host-runner'
          - id: tool-cordis
            name: '@roos-code/roos-code-tool-cordis'
