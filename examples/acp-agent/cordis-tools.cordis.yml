# Add the self-referential Cordis tools without changing the base ACP tool
# presentation mode.
- id: base
  name: '@shres-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: cordis-host-runner
            name: '@shres-code/shres-code-cordis-host-runner'
          - id: tool-cordis
            name: '@shres-code/shres-code-tool-cordis'
