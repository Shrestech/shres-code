# Keyless real-Loader composition for workspace-instruction resume
# reconciliation. The test seeds one persisted baseline, changes AGENTS.md
# while the session is offline, then resumes through the public agent service.

- id: persistence
  name: '@roos-code/roos-code-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@roos-code/roos-code-llm-replay'
  config:
    file: !!js process.env.ROOS_SNAPSHOT_FILE
    overrideFile: !!js process.env.ROOS_SNAPSHOT_OVERRIDE

- id: fs-local
  name: '@roos-code/roos-code-fs-local'
  config:
    cwd: !!js process.cwd()

- id: agent
  name: '@roos-code/roos-code-agent-spine-demo'
  config:
    agents: []
    workspaceContext:
      maxBytes: 65536
      roosHome: !!js process.cwd() + '/.roos'
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

# Await the persisted resume before the headless driver inspects root agents.
- id: resumed-agent
  name: './tests/fixtures/workspace-context-resume-agent.ts'
