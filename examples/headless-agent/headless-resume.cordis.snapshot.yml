# Routed first spawn of the headless --session-id/--resume two-spawn snapshot:
# the product headless profile over the loopback stub with the router ON and
# a scripted judgment engine answering route and difficulty asks.

- id: llm-deepseek
  config:
    baseURL: !!js process.env.SHRES_SNAPSHOT_BASE_URL

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- insert:
    - id: model-router
      name: '@shres-code/shres-code-model-router'
      config:
        initialMode: on
        candidates:
          - id: flash
            provider: deepseek-official
            model: deepseek-v4-flash
            description: a small, well-scoped change in familiar code
        routeFrom:
          - provider: deepseek-official
            model: deepseek-v4-pro
            objective: dollars
        downgradeThreshold: 0.7
        downgradeMargin: 0.5
        hold:
          minSteps: 3
        # Candidate failures stay terminal here; the resumed spawn composes no
        # router at all, so no fallback surface is under test.
        inTurnFallback: off
        routeInstructions: Pick the cheapest route that can finish this turn.
        difficultyInstructions: Rate how much reasoning this turn needs.
    - id: judgment-dispatch
      name: '@shres-code/shres-code-judgment-dispatch'
      config:
        defaultEngine: snapshot
    - id: model-router-snapshot-fixture
      name: './snapshot-fixtures/model-router-snapshot-fixture.ts'
