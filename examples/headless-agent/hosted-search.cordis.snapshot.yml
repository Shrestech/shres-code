# Keyless hosted-tools composition for the headless stream-json snapshot: the
# fixture backend serves a Responses turn carrying every hosted X call name and
# a local todo_write call, then checks the replayed second step. The default
# route declares both hosted tools, so the run exercises the production splice
# (hosted entries in, superseded local tools dropped), promotion, and replay
# over a real HTTP wire with no API key.
- id: base
  name: '@shres-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@shres-code/shres-code-llm-deepseek'
        disabled: true
      - insert:
          - id: hosted-search-snapshot-backend
            name: './tests/fixtures/hosted-search-snapshot-backend.mjs'
