# Keyless model-routing composition with a judgment engine that is not ready:
# the shipping `cordis.yml` spine and the router composed ON, with the
# dispatcher selecting TypeSafe whose API key reference holds no value, so the
# engine reports `unconfigured`. The dispatcher refuses every ask before any
# request leaves, each refusal counts as a failed judgment, and the breaker
# opens on the second one.

- id: base
  name: '@shres-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.SHRES_SNAPSHOT_BASE_URL
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-pro
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
      - insert:
          - id: model-router
            name: '@shres-code/shres-code-model-router'
            config:
              initialMode: on
              candidates:
                - id: flash
                  provider: deepseek-official
                  model: deepseek-v4-flash
                  description: a small, well-scoped change in familiar code
              routeFrom:
                - provider: deepseek-official
                  model: deepseek-v4-pro
                  objective: dollars
              downgradeThreshold: 0.7
              downgradeMargin: 0.5
              judgmentFailures:
                breakerThreshold: 2
              routeInstructions: Pick the cheapest route that can finish this turn.
              difficultyInstructions: Rate how much reasoning this turn needs.
          - id: judgment-dispatch
            name: '@shres-code/shres-code-judgment-dispatch'
            config:
              defaultEngine: typesafe
          - id: judgment-typesafe
            name: '@shres-code/shres-code-judgment-typesafe'
            config:
              # A reference no environment sets: the engine stays unconfigured.
              apiKeyRef: SHRES_SNAPSHOT_UNSET_TYPESAFE_KEY
