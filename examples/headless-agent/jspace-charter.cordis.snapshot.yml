# Replay counterpart to jspace.cordis.yml with executor-enforced charter gates.
# Includes cordis.yml directly because a config patch cannot target an entry
# behind a nested include, then restates the jspace overlay while replacing
# the live model with keyless replay.
- id: base
  name: '@shres-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@shres-code/shres-code-llm-deepseek'
        disabled: true
      - insert:
          - id: jspace
            name: '@shres-code/shres-code-jspace'
            config: { enabled: true, mode: available, requireCoverage: true }
          - id: jspace-prompt
            name: '@shres-code/shres-code-jspace-prompt'
          - id: tool-jspace
            name: '@shres-code/shres-code-tool-jspace'
            config:
              requireCharter: true
              requireExecutableCharter: true
              charterSeed: true
              charterDiscrimination: required
              charterCheckTimeoutMs: 30000
              maxCharterEntries: 12
              charterChecksMustBeReadOnly: true
          - id: llm-replay
            name: '@shres-code/shres-code-llm-replay'
