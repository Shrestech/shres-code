# Keyless assembled-app coverage for named-seat Team-steer: a bound Aegis
# seat's first `team_send` provisions the teammate and returns mailbox status.

- id: persistence
  name: '@shres-code/shres-code-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@shres-code/shres-code-llm-replay'

- id: session-projection
  name: '@shres-code/shres-code-session-projection'

- id: settings
  name: '@shres-code/shres-code-settings-file'
  config:
    watch: false

- id: subagent
  name: '@shres-code/shres-code-subagent'

- id: subagent-spawn-in-process
  name: '@shres-code/shres-code-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: agent-team
  name: '@shres-code/shres-code-agent-team'

- id: agent-seats
  name: '@shres-code/shres-code-agent-seats'

- id: agent
  name: '@shres-code/shres-code-agent-spine-demo'
  config:
    agents:
      - id: team-lead
        provider: deepseek-official
        model: deepseek-v4-flash
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
