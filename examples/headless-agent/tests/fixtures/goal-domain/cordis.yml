# Test-only composition: create one goal through a Loader-mounted step consumer.
- id: cli-mock-llm
  name: '../cli-mock-llm.ts'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@roos-code/roos-code-subprocess-local'

- id: bash
  name: '@roos-code/roos-code-bash-local'

- id: goal
  name: '@roos-code/roos-code-goal'
  config:
    defaultMaxGoalRounds: 11

- id: seed-goal
  name: './seed-goal.ts'

- id: agent-spine
  name: '@roos-code/roos-code-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()
    persona: 'Test the persisted goal domain.'
    workspaceContext: false

- id: persistence
  name: '@roos-code/roos-code-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: checkpoint-policy
  name: '@roos-code/roos-code-session-checkpoint-policy'
