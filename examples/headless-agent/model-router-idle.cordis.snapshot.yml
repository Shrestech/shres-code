# Routing idle on the routing target: the first turn downgrades from the listed
# strong route to the flash candidate, the select driver then selects flash on
# the live agent, and the second turn breaks the streak as a manual deviation.
# flash is also listed in routeFrom, so the third turn starts from a listed
# route whose only candidate is the route itself and logs candidate-equals-base,
# while the projection keeps pro as the strong route to restore.

- id: base
  name: '@shres-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.SHRES_SNAPSHOT_BASE_URL
      - id: agent-spine
        config:
          agents: []
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
      - insert:
          - id: agent-default-model
            name: '@shres-code/shres-code-agent-default-model'
            config:
              provider: deepseek-official
              model: deepseek-v4-pro
          - id: model-router
            name: '@shres-code/shres-code-model-router'
            config:
              initialMode: on
              candidates:
                - id: flash
                  provider: deepseek-official
                  model: deepseek-v4-flash
                  description: a small, well-scoped change in familiar code
              routeFrom:
                - provider: deepseek-official
                  model: deepseek-v4-pro
                  objective: dollars
                - provider: deepseek-official
                  model: deepseek-v4-flash
                  objective: dollars
              downgradeThreshold: 0.7
              downgradeMargin: 0.5
              hold:
                minSteps: 3
              routeInstructions: Pick the cheapest route that can finish this turn.
              difficultyInstructions: Rate how much reasoning this turn needs.
          - id: judgment-dispatch
            name: '@shres-code/shres-code-judgment-dispatch'
            config:
              defaultEngine: snapshot
          - id: model-router-snapshot-fixture
            name: './tests/fixtures/model-router-snapshot-fixture.ts'
