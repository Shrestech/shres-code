# Keyless model-routing composition for the headless stream-json snapshot:
# the shipping `cordis.yml` spine with the routed turns served by a loopback
# stub, the router composed ON, and a settings-file mode sequence driven by the
# scripted fixture before each accepted pre-step.

- id: base
  name: '@shres-code/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.SHRES_SNAPSHOT_BASE_URL
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-pro
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
      - insert:
          - id: agent-default-model
            name: '@shres-code/shres-code-agent-default-model'
            config:
              provider: deepseek-official
              model: deepseek-v4-pro
          - id: model-router
            name: '@shres-code/shres-code-model-router'
            config:
              initialMode: on
              candidates:
                - id: flash
                  provider: deepseek-official
                  model: deepseek-v4-flash
              downgradeThreshold: 0.7
              downgradeMargin: 0.5
              minTurnsDowngraded: 3
              # Deployment choice: the lift's threshold sits above the scripted
              # difficulty, so no turn is lifted.
              difficultyToEffort:
                scoreThreshold: 4
                reasoningEffort: high
              routeInstructions: Pick the cheapest route that can finish this turn.
              difficultyInstructions: Rate how much reasoning this turn needs.
          - id: judgment-dispatch
            name: '@shres-code/shres-code-judgment-dispatch'
            config:
              defaultEngine: snapshot
          - id: model-router-snapshot-fixture
            name: './tests/fixtures/model-router-snapshot-fixture.ts'
            config:
              deploymentModes: [on, off, on, off]
              manualModeTurn: 4
