# One-shot coding agent with format-pure stdout. The app bin loads the
# gitignored root `.env` into the process environment; entry configs here are
# the composition base, while user-plane values resolve per request through
# the two providers below.

# User-settings document (`$SHRES_HOME/settings.yaml`, hot-reloaded): a
# `llm-deepseek:` section there overrides the adapter entry below without a
# restart.
- id: settings
  name: '@shres-code/shres-code-settings-file'

# Credential store: the live process environment over `$SHRES_HOME/.credentials.yaml`
# (owner-only file, hot-reloaded). The adapter resolves `DEEPSEEK_API_KEY`
# through it at each request, so no key is inlined in this file.
- id: credentials
  name: '@shres-code/shres-code-credentials-local'

# The DeepSeek adapter. Swap to '@shres-code/shres-code-llm-pi-ai' for the pi-ai-backed
# twin (a `providers` dict keyed by route; `reasoning: high` replaces
# thinking/reasoningEffort). Shipped default: full thinking at max effort on
# every request. Exact-model resolution materializes request defaults before
# the request header is logged.
- id: llm-deepseek
  name: '@shres-code/shres-code-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro
        contextWindow: 128000
      - id: deepseek-v4-flash
        contextWindow: 128000

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@shres-code/shres-code-subprocess-local'

- id: bash
  name: '@shres-code/shres-code-bash-local'
  config:
    timeoutMs: 60000

# The example composition pre-creates one fresh `main` agent for its test driver.
- id: agent-spine
  name: '@shres-code/shres-code-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        # Stays on flash: the goal/ralph replay corpora were recorded on it, and
        # their nested-include overlays cannot re-pin the app config (a config
        # patch cannot target an entry behind a nested include).
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are headless-agent, a coding assistant.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: persistence
  name: '@shres-code/shres-code-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.SHRES_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@shres-code/shres-code-session-checkpoint-policy'

# The ACP app mounts the derived index internally; this leaf registers both
# the SQLite service and the model-facing consumer. Search stays enabled
# (`openAt` defaults to `startup`) so history tools can query the live log.
- id: session-query-sqlite
  name: '@shres-code/shres-code-session-query-sqlite'
  config:
    path: './.sessions/session-query.db'

- id: tool-session-query
  name: '@shres-code/shres-code-tool-session-query'

- id: timeout-policy
  name: '@shres-code/shres-code-tool-call-timeout-policy'

# Summarize an older range when derived history approaches the context window.
- id: token-meter
  name: '@shres-code/shres-code-token-meter'

- id: compaction-basic
  name: '@shres-code/shres-code-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Projection registry: durable subagent identity (mode/label) folds through
# its registered units; subagent catalog reads fail loud without the capability.
- id: session-projection
  name: '@shres-code/shres-code-session-projection'

# Expose fresh-child `spawn` and completed-prefix `fork` through independent
# in-process backends.
- id: subagent
  name: '@shres-code/shres-code-subagent'

- id: subagent-spawn-in-process
  name: '@shres-code/shres-code-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@shres-code/shres-code-subagent-fork-in-process'
  config:
    providerName: fork

# Continuable background children are selected per delegation tool. The
# separately loaded control registers global `send_message`; `report` is
# installed only in continuable child scopes.
- id: tool-subagent-control
  name: '@shres-code/shres-code-tool-subagent-control'

- id: tool-subagent-report
  name: '@shres-code/shres-code-tool-subagent-report'

- id: tool-subagent
  name: '@shres-code/shres-code-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

# Fork stays one-shot because a continuable child's `report` tool and prompt
# section precede the inherited history a fork reuses; `run_in_background` is off
# because this example mounts no task service. See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
- id: tool-subagent-fork
  name: '@shres-code/shres-code-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# The worker-thread workflow engine fans a model-written JavaScript script's
# `agent()` calls out through the spawn backend.
- id: workflow-worker-thread
  name: '@shres-code/shres-code-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@shres-code/shres-code-tool-workflow'

# A separate fixed consumer demonstrates fresh-agent Ralph iteration without
# changing the workflow tool or same-session goal behavior.
- id: tool-ralph
  name: '@shres-code/shres-code-tool-ralph'

# `todo_write` replaces the logged whole list.
- id: tool-todo
  name: '@shres-code/shres-code-tool-todo'
  config:
    allowParallelInProgress: true

# Policy loads before the model-facing filesystem tools so writes and edits
# require an observed file. Relative paths resolve from the process cwd.
- id: fs-local
  name: '@shres-code/shres-code-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@shres-code/shres-code-fs-observation-policy'

- id: tool-fs
  name: '@shres-code/shres-code-tool-fs'
